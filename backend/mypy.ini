[mypy]
python_version = 3.12
strict = true
plugins =
    pydantic.mypy,
    sqlalchemy.ext.mypy.plugin
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true

[pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
